[env:seeed_xiao_esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

; USB flashing baud rate (no serial monitor is configured)
upload_speed  = 921600

; Strip debug symbols and enable size optimisation for production
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8
